[project]
name = "twitter-forward-to-telegram"
version = "0.1.0"
description = "Forwards Love Live! Bluebird character tweets to Telegram, translated to Korean"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.121.0",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "pydantic>=2.13.0",
    "uvicorn>=0.38.0",
    "asyncpg>=0.31.0",
    "kubernetes-asyncio>=36.1.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    # http, not the otlp metapackage: that one drags in grpcio, a native
    # dependency this Alpine image has no libstdc++ for.
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-prometheus",
    "opentelemetry-instrumentation-asyncpg>=0.62b1",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "prometheus-client",
]
[dependency-groups]
alembic = [
    "alembic>=1.19.0",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy-cockroachdb>=2.0.4",
]
lint = [
    "ruff>=0.16.0",
]
[tool.uv]
default-groups = "all"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# Selected explicitly so a ruff upgrade cannot quietly widen the rule set.
select = [
    "E4", "E7", "E9", "F",  # pyflakes + the pycodestyle rules the formatter leaves alone
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "G",    # flake8-logging-format
    "SIM",  # flake8-simplify
    "DTZ",  # flake8-datetimez
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "telegram", "translate", "tweet"]
[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = [
    ".",
    "./src"
]

# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = "utf-8"

# Scripts run against newly generated revision scripts. Ruff covers both
# formatting and linting, so there is no separate black hook.
[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "exec"
executable = "%(here)s/.venv/bin/ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-check"
type = "exec"
executable = "%(here)s/.venv/bin/ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
