name: Build and Push Docker Image to Amazon ECR

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# for AWS OIDC auth (AssumeRoleWithWebIdentity)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: lovelive-bluebird-twitter-to-telegram

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Extract branch/tag name and SHA for tagging. Pure git/ref work, so it
      # also runs on pull requests, where there are no AWS credentials.
      - name: Extract metadata for Docker
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            REF_TAG="${GITHUB_REF#refs/heads/}"
          else
            REF_TAG="pr-${{ github.event.number }}"
          fi

          # Slashes are legal in branch names but not in image tags
          echo "ref_tag=${REF_TAG//\//-}" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Login to ECR
      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Docker image to ECR
      - name: Build and push image to Amazon ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # On pull requests there is no ECR registry to name, and nothing is
          # pushed; "local" just keeps the tags well-formed for the build.
          tags: |
            ${{ steps.login-ecr.outputs.registry || 'local' }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.ref_tag }}
            ${{ steps.login-ecr.outputs.registry || 'local' }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:latest', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
